<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today's BIGBANG Song</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #FFE561;
  color: #292929;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px;
}

.container {
  width: 100%;
  max-width: 440px;
  text-align: center;
}

.logo {
  font-size: 13px;
  letter-spacing: 5px;
  margin-bottom: 48px;
}

.date {
  font-size: 13px;
  color: #B37800;
  letter-spacing: 2px;
}

h1 {
  font-size: 20px;
  margin: 15px 0 8px;
}

.song-title {
  font-size: 50px;
  margin: 8px 0;
}

.artist {
  color: #835800;
  font-size: 15px;
}

.description {
  font-size: 10px;
  color: #B37800;
  line-height: 1.7;
  margin: 25px 0;
}

.youtube {
  display: block;
  background: #292929;
  color: white;
  text-decoration: none;
  padding: 16px;
  border-radius: 5px;
  font-size: 13px;
  letter-spacing: 2px;
}

.footer {
  margin-top: 35px;
  color: #B37800;
  font-size: 11px;
  letter-spacing: 2px;
}
</style>
</head>

<body>
<div class="container">

  <div class="logo">Today's BIGBANG SONG</div>

  <div class="date" id="date"></div>

  <h1>오늘의 빅뱅 노래</h1>

  <h2 class="song-title" id="title"></h2>

  <div class="artist" id="artist"></div>

  <p class="description">
    일본곡, 멤버 솔로곡 포함<br>
    BIGBANG is the best
  </p>

  <a class="youtube" id="youtube"
     href="#" target="_blank" rel="noopener">
    ▶ LISTEN ON YOUTUBE
  </a>

  <div class="footer">X: @leeleeee426</div>

</div>

<script>
const songs = [
  {
    title: "BiiiG",
    artist: "BIGBANG•[BiiiG]•2026",
    youtube: "https://youtu.be/L8ZnXgbyUuc"
  },
  {
    title: "꽃 길",
    artist: "BIGBANG•[꽃 길]•2018",
    youtube: "https://youtu.be/VWqxvBQKwKQ"
  },
  {
    title: "봄여름가을겨울 (Still Life)",
    artist: "BIGBANG•[봄여름가을겨울 (Still Life)]•2022",
    youtube: "https://youtu.be/eN5mG_yMDiM"
  }
];

// 한국 날짜 가져오기
function getKoreanDate() {
  return new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Seoul",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).format(new Date());
}

// 날짜를 기반으로 랜덤 시드 생성
function seededRandom(seed) {
  let value = seed;

  return function() {
    value = (value * 9301 + 49297) % 233280;
    return value / 233280;
  };
}

// 오늘의 날짜
const dateText = getKoreanDate();

// 날짜를 숫자로 변환
const dateSeed = Number(dateText.replaceAll("-", ""));

// 오늘만의 랜덤 생성기
const random = seededRandom(dateSeed);

// 랜덤으로 노래 선정
const index = Math.floor(random() * songs.length);

const song = songs[index];

// 화면에 표시
document.getElementById("date").textContent = dateText;

document.getElementById("title").textContent =
  song.title;

document.getElementById("artist").textContent =
  song.artist;

document.getElementById("youtube").href =
  song.youtube ||
  "https://www.youtube.com/results?search_query=" +
  encodeURIComponent(song.title + " " + song.artist);

</script>
</body>
</html>
